# Render Blueprint: one Docker web service. In Render: New > Blueprint,
# pick this repository.
services:
  - type: web
    name: resourcelocate
    runtime: docker
    # Free plan: no persistent disk, so the SQLite database starts empty on
    # every deploy and restart (including waking from sleep). To keep data,
    # switch to plan: starter and add the disk below.
    plan: free
    healthCheckPath: /healthz
    envVars:
      # Render's proxy sets X-Forwarded-For, so rate limits apply per visitor.
      - key: TRUST_PROXY
        value: "1"
      # One-click demo accounts for judges. Remove after the hackathon.
      - key: DEMO_LOGINS
        value: "1"
    # disk:
    #   name: data
    #   mountPath: /data
    #   sizeGB: 1
